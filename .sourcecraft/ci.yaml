on:
  push:
    - workflows: [ci-workflow, deploy-to-serverless]
      filter:
        branches: [master]
  pull_request:
    - workflows: [ci-workflow]
      filter:
        branches: [master]

tokens:
  SERVICE_CONNECTION:
    service_connection: default-service-connection
    scope: org

workflows:
  ci-workflow:
    tasks:
    - name: ci-task
      cubes:
        - name: setup-and-test
          image: docker.io/library/python:3.11
          script:
            - pip install --upgrade pip
            - pip install -r requirements.txt
            - python -c "import flask, requests; print('Imports OK')"
            - pytest -q

        - name: docker-build
          image: docker.io/library/docker:latest
          script:
            - docker build -t icsbot:ci .
            - docker save icsbot:ci | gzip > icsbot.tar.gz
          artifacts:
            - icsbot.tar.gz

        - name: deploy
          image: docker.io/library/alpine:latest
          script:
            - echo "Deployment steps would go here"
            # Note: SSH deployment would require service connections in SourceCraft

  deploy-to-serverless:
    tasks:
      - name: deploy-task
        env:
          YC_DOCKER_REGISTRY_URI: cr.yandex/<YOUR_DOCKER_REGISTRY_ID>
          IMAGE_NAME: icsbot-image
          YC_SERVERLESS_CONTAINER_NAME: icsbot-container
        cubes:
          # Return IAM-token through outputs.IAM_TOKEN
          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          # Login to Yandex Container Registry
          - name: login-to-ycr
            env:
              IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
            image: docker.io/library/docker:latest
            script:
              - echo $IAM_TOKEN | docker login --username iam --password-stdin cr.yandex

          # Build and push Docker image
          - name: build-and-push
            env:
              YC_DOCKER_REGISTRY_URI: ${{ env.YC_DOCKER_REGISTRY_URI }}
              IMAGE_NAME: ${{ env.IMAGE_NAME }}
            image: docker.io/library/docker:latest
            script:
              - docker build -t $YC_DOCKER_REGISTRY_URI/$IMAGE_NAME:latest .
              - docker push $YC_DOCKER_REGISTRY_URI/$IMAGE_NAME:latest

          # Deploy to Yandex Serverless Containers
          - name: deploy-to-serverless
            env:
              YC_FOLDER_ID: ${{ tokens.SERVICE_CONNECTION.folder_id }}
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              YC_DOCKER_REGISTRY_URI: ${{ env.YC_DOCKER_REGISTRY_URI }}
              IMAGE_NAME: ${{ env.IMAGE_NAME }}
              YC_SERVERLESS_CONTAINER_NAME: ${{ env.YC_SERVERLESS_CONTAINER_NAME }}
              YC_SERVICE_ACCOUNT_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-cli:latest
            script:
              - yc config set folder-id $YC_FOLDER_ID
              - yc config set token $YC_IAM_TOKEN

              # Check if the serverless container exists
              - |
                if ! yc serverless container get --name $YC_SERVERLESS_CONTAINER_NAME &>/dev/null; then
                    echo "Container $YC_SERVERLESS_CONTAINER_NAME does not exist. Creating it..."
                    yc serverless container create --name $YC_SERVERLESS_CONTAINER_NAME --description "ICS Bot Container created automatically"
                    echo "Container $YC_SERVERLESS_CONTAINER_NAME created successfully"
                else
                    echo "Container $YC_SERVERLESS_CONTAINER_NAME already exists"
                fi

              # Deploy new revision
              - yc serverless container revision deploy --container-name $YC_SERVERLESS_CONTAINER_NAME --image $YC_DOCKER_REGISTRY_URI/$IMAGE_NAME:latest --service-account-id $YC_SERVICE_ACCOUNT_ID