services:
  ydb-local:
    image: ydbplatform/local-ydb:latest
    container_name: ydb-local
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "2135:2135"
      - "2136:2136"
      - "8765:8765"
      - "9092:9092"
    environment:
      GRPC_TLS_PORT: "2135"
      GRPC_PORT: "2136"
      MON_PORT: "8765"
      YDB_KAFKA_KAFKA_PROXY_PORT: "9092"
    volumes:
      - "D:/Work/ydb/ydb_certs:/ydb_certs"
      - ydb_data:/ydb_data
    networks:
      - ydbnet
  ics-gate:
    env_file:
      - .env
    build: .
    container_name: ics-gate
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      ydb-local:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ydbnet

networks:
  ydbnet:
    driver: bridge

volumes:
  ydb_data: